# Docker Compose overlay for federation testing.
#
# Runs a local TimeOverflow instance with federation enabled,
# ready to connect to a Nexus instance.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.federation.yml up
#
# Then:
#   docker compose exec app rake federation:setup
#   docker compose exec app rake federation:status
#
version: '3'
services:
  app:
    volumes:
      - ./app:/app/app
      - ./config/initializers/0_api_controller_fix.rb:/app/config/initializers/0_api_controller_fix.rb
      - ./config/initializers/federation_api.rb:/app/config/initializers/federation_api.rb
      - ./config/routes.rb:/app/config/routes.rb
      - ./config/schedule.yml:/app/config/schedule.yml
      - ./db/migrate:/app/db/migrate
      - ./lib:/app/lib
    environment:
      - FEDERATION_ENABLED=true
      - FEDERATION_WEBHOOK_TIMEOUT=10
      - FEDERATION_RATE_LIMIT=100
      - ALLOWED_HOSTS=localhost 34.175.14.41 timeoverflow.exchangemembers.com timeoverflow-develop-app-1 timeoverflow-app
    labels:
      - "federation=enabled"
  sidekiq:
    volumes:
      - ./app:/app/app
      - ./config/initializers/0_api_controller_fix.rb:/app/config/initializers/0_api_controller_fix.rb
      - ./config/initializers/federation_api.rb:/app/config/initializers/federation_api.rb
      - ./config/schedule.yml:/app/config/schedule.yml
      - ./lib:/app/lib
    environment:
      - FEDERATION_ENABLED=true
    # Override the Dockerfile HEALTHCHECK (which hits port 3000/HTTP).
    # Sidekiq doesn't serve HTTP — check that the sidekiq process is alive instead.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
